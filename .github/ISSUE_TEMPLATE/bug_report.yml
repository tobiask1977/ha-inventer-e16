name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post your PSK, BLE address or IP address.** The diagnostics download of the
        integration redacts them.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Integration version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.4"
    validations:
      required: true
  - type: textarea
    id: firmware
    attributes:
      label: Firmware versions
      description: Shown by the four firmware update entities.
      placeholder: "Wi-Fi module 1.3.11, controller 5.30.10, fans 5.30.9, sensors 5.30.8"
  - type: textarea
    id: setup
    attributes:
      label: Your system
      description: Number of fan units and sensors, zones, active profile.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and log
      description: Attach the diagnostics download and relevant log lines (`custom_components.inventer_e16`).
      render: text
