set_mode:
  target:
    entity:
      integration: inventer_e16
      domain: fan
  fields:
    mode:
      required: true
      selector:
        select:
          translation_key: set_mode_mode
          options:
            - heat_recovery
            - ventilation
            - pause
            - pause_open
    speed:
      default: 1
      selector:
        number:
          min: 1
          max: 4
          mode: slider
    minutes:
      selector:
        number:
          min: 15
          max: 480
          step: 15
          unit_of_measurement: min
